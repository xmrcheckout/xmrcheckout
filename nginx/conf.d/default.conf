map $request_method $ui_post_client {
  default "";
  POST    $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=global_client_rate_limit:10m rate=50r/s;
limit_req_zone $ui_post_client zone=ui_post_rate_limit:10m rate=5r/s;

limit_req_zone $ui_post_client zone=public_purchase_rate_limit:10m rate=6r/m;

server {
  listen 80;
  server_name localhost host.docker.internal example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name localhost host.docker.internal example.com;

  ssl_certificate /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;

  limit_req zone=global_client_rate_limit burst=200 nodelay;

  if ($request_uri ~* "//+") {
    return 308 $scheme://$host$uri$is_args$args;
  }

  location ^~ /api/core/public/payment-links/ {
    limit_req zone=global_client_rate_limit burst=200 nodelay;
    limit_req zone=public_purchase_rate_limit burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @purchase_limited;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @purchase_limited {
    default_type text/html;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 429 '<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout unavailable</title><h1>Too many purchase requests</h1><p>Wait at least one minute. Contact the merchant before retrying if a previous invoice request was interrupted.</p></html>';
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api {
    return 301 /api/;
  }

  location = /openapi.json {
    proxy_pass http://api:8000/openapi.json;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /qr/ {
    alias /qr/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    # A location-level limit replaces inherited limits, so retain both here.
    limit_req zone=global_client_rate_limit burst=200 nodelay;
    limit_req zone=ui_post_rate_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass http://ui:3000/;
    proxy_http_version 1.1;

    # Preserve a public port for Server Action origin checks, and replace any
    # client-supplied forwarded host with the host actually used on this hop.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

x-runtime-security: &runtime-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./qr:/qr:ro
    depends_on:
      ui:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped
  api:
    <<: *runtime-security
    build:
      context: ./api
    user: "10001:10001"
    group_add:
      - "20000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEYS: ${API_KEYS}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      FOUNDER_PAYMENT_ADDRESS: ${FOUNDER_PAYMENT_ADDRESS}
      FOUNDER_VIEW_KEY: ${FOUNDER_VIEW_KEY}
      DONATIONS_ENABLED: ${DONATIONS_ENABLED:-false}
      QR_STORAGE_DIR: ${QR_STORAGE_DIR:-/qr}
      MONERO_WALLET_RPC_URLS: ${MONERO_WALLET_RPC_URLS:-http://wallet-rpc-reconciler-1:18083,http://wallet-rpc-reconciler-2:18083,http://wallet-rpc-reconciler-3:18083}
      MONERO_WALLET_RPC_USER: ${MONERO_WALLET_RPC_USER}
      MONERO_WALLET_RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD}
      MONERO_WALLET_RPC_WALLET_PASSWORD: ${MONERO_WALLET_RPC_WALLET_PASSWORD}
      MONERO_WALLET_RPC_WALLET_DIR: ${MONERO_WALLET_RPC_WALLET_DIR:-/wallets}
      MONERO_DAEMON_URL: ${MONERO_DAEMON_URL:-http://xmr-node.cakewallet.com:18081}
      MONERO_WALLET_RPC_LOCK_TIMEOUT_SECONDS: ${MONERO_WALLET_RPC_LOCK_TIMEOUT_SECONDS:-15}
      MONERO_WALLET_READY_TIMEOUT_SECONDS: ${MONERO_WALLET_READY_TIMEOUT_SECONDS:-60}
      MONERO_WALLET_READY_POLL_INTERVAL_SECONDS: ${MONERO_WALLET_READY_POLL_INTERVAL_SECONDS:-1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-5}
    volumes:
      - ./qr:/qr
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1777
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  reconciler:
    <<: *runtime-security
    build:
      context: ./api
    user: "10001:10001"
    command: ["python", "-m", "app.reconciler"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1777
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_KEYS: ${API_KEYS}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY}
      INVOICE_RECONCILE_INTERVAL_SECONDS: ${INVOICE_RECONCILE_INTERVAL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONERO_WALLET_RPC_URLS: ${MONERO_WALLET_RPC_URLS:-http://wallet-rpc-reconciler-1:18083,http://wallet-rpc-reconciler-2:18083,http://wallet-rpc-reconciler-3:18083}
      MONERO_WALLET_RPC_USER: ${MONERO_WALLET_RPC_USER}
      MONERO_WALLET_RPC_PASSWORD: ${MONERO_WALLET_RPC_PASSWORD}
      MONERO_WALLET_RPC_WALLET_PASSWORD: ${MONERO_WALLET_RPC_WALLET_PASSWORD}
      MONERO_WALLET_RPC_WALLET_DIR: ${MONERO_WALLET_RPC_WALLET_DIR:-/wallets}
      MONERO_DAEMON_URL: ${MONERO_DAEMON_URL:-http://xmr-node.cakewallet.com:18081}
      MONERO_WALLET_RPC_LOCK_TIMEOUT_SECONDS: ${MONERO_WALLET_RPC_LOCK_TIMEOUT_SECONDS:-15}
      MONERO_WALLET_READY_TIMEOUT_SECONDS: ${MONERO_WALLET_READY_TIMEOUT_SECONDS:-60}
      MONERO_WALLET_READY_POLL_INTERVAL_SECONDS: ${MONERO_WALLET_READY_POLL_INTERVAL_SECONDS:-1}
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      wallet-rpc-reconciler-1:
        condition: service_healthy
      wallet-rpc-reconciler-2:
        condition: service_healthy
      wallet-rpc-reconciler-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.reconciler_healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  monerod:
    <<: *runtime-security
    build:
      context: ./docker/monero
      args:
        MONERO_VERSION: ${MONERO_VERSION:-0.18.5.1}
    image: monero-local:${MONERO_VERSION:-0.18.5.1}
    user: "10001:10001"
    entrypoint: ["monerod"]
    command:
      [
        "--non-interactive",
        "--rpc-bind-ip",
        "0.0.0.0",
        "--rpc-bind-port",
        "18081",
        "--confirm-external-bind",
        "--prune-blockchain",
        "--data-dir",
        "/data",
        "--log-level",
        "0"
      ]
    volumes:
      - monerod_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1777
      - /home/monero:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18081/get_height >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    profiles: ["local-daemon"]
  wallet-rpc-reconciler-1:
    <<: *runtime-security
    build:
      context: ./docker/monero
      args:
        MONERO_VERSION: ${MONERO_VERSION:-0.18.5.1}
    image: monero-local:${MONERO_VERSION:-0.18.5.1}
    user: "10001:10001"
    command:
      [
        "monero-wallet-rpc",
        "--non-interactive",
        "--rpc-bind-ip",
        "0.0.0.0",
        "--rpc-bind-port",
        "18083",
        "--confirm-external-bind",
        "--daemon-address",
        "${MONERO_DAEMON_URL:-http://xmr-node.cakewallet.com:18081}",
        "--daemon-ssl",
        "disabled",
        "--rpc-login",
        "${MONERO_WALLET_RPC_USER}:${MONERO_WALLET_RPC_PASSWORD}",
        "--wallet-dir",
        "${MONERO_WALLET_RPC_WALLET_DIR:-/wallets}",
        "--password",
        "${MONERO_WALLET_RPC_WALLET_PASSWORD}",
        "--log-level",
        "0"
      ]
    volumes:
      - ./wallets/reconciler-1:/wallets
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1777
      - /home/monero:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":\"health\",\"method\":\"get_version\"}' http://127.0.0.1:18083/json_rpc"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  wallet-rpc-reconciler-2:
    <<: *runtime-security
    build:
      context: ./docker/monero
      args:
        MONERO_VERSION: ${MONERO_VERSION:-0.18.5.1}
    image: monero-local:${MONERO_VERSION:-0.18.5.1}
    user: "10001:10001"
    command:
      [
        "monero-wallet-rpc",
        "--non-interactive",
        "--rpc-bind-ip",
        "0.0.0.0",
        "--rpc-bind-port",
        "18083",
        "--confirm-external-bind",
        "--daemon-address",
        "${MONERO_DAEMON_URL:-http://xmr-node.cakewallet.com:18081}",
        "--daemon-ssl",
        "disabled",
        "--rpc-login",
        "${MONERO_WALLET_RPC_USER}:${MONERO_WALLET_RPC_PASSWORD}",
        "--wallet-dir",
        "${MONERO_WALLET_RPC_WALLET_DIR:-/wallets}",
        "--password",
        "${MONERO_WALLET_RPC_WALLET_PASSWORD}",
        "--log-level",
        "0"
      ]
    volumes:
      - ./wallets/reconciler-2:/wallets
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1777
      - /home/monero:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":\"health\",\"method\":\"get_version\"}' http://127.0.0.1:18083/json_rpc"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  wallet-rpc-reconciler-3:
    <<: *runtime-security
    build:
      context: ./docker/monero
      args:
        MONERO_VERSION: ${MONERO_VERSION:-0.18.5.1}
    image: monero-local:${MONERO_VERSION:-0.18.5.1}
    user: "10001:10001"
    command:
      [
        "monero-wallet-rpc",
        "--non-interactive",
        "--rpc-bind-ip",
        "0.0.0.0",
        "--rpc-bind-port",
        "18083",
        "--confirm-external-bind",
        "--daemon-address",
        "${MONERO_DAEMON_URL:-http://xmr-node.cakewallet.com:18081}",
        "--daemon-ssl",
        "disabled",
        "--rpc-login",
        "${MONERO_WALLET_RPC_USER}:${MONERO_WALLET_RPC_PASSWORD}",
        "--wallet-dir",
        "${MONERO_WALLET_RPC_WALLET_DIR:-/wallets}",
        "--password",
        "${MONERO_WALLET_RPC_WALLET_PASSWORD}",
        "--log-level",
        "0"
      ]
    volumes:
      - ./wallets/reconciler-3:/wallets
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=1777
      - /home/monero:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":\"health\",\"method\":\"get_version\"}' http://127.0.0.1:18083/json_rpc"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
  ui:
    <<: *runtime-security
    build:
      context: ./ui
      args:
        DONATIONS_ENABLED: ${DONATIONS_ENABLED:-false}
        NEXT_PUBLIC_DONATIONS_ENABLED: ${DONATIONS_ENABLED:-false}
    user: "1000:1000"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://nginx/api}
      DONATIONS_ENABLED: ${DONATIONS_ENABLED:-false}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost}
      NEXT_PUBLIC_DONATIONS_ENABLED: ${DONATIONS_ENABLED:-false}
    depends_on:
      api:
        condition: service_started
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0750
    restart: unless-stopped
  db:
    <<: *runtime-security
    image: postgres:16-alpine
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=0750
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  db-backup:
    <<: *runtime-security
    build:
      context: ./docker/pg_backup
    user: "70:70"
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups/postgres:/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=70,gid=70,mode=1777
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["db-backup"]
volumes:
  postgres_data:
  monerod_data:
